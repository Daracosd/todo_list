<main class="container">
  <h1>My Todos</h1>

  <div class="add-row">
    <input
      [(ngModel)]="newTitle"
      (keyup.enter)="add()"
      placeholder="What needs doing?"
    />
    <button (click)="add()" [disabled]="isAdding">{{isAdding ? 'Adding...' : 'Add'}}</button>
  </div>

  @if (errorMessage) {
    <p class="error" role="alert">{{errorMessage}}</p>
  }

  <ul>
    @for (todo of todos; track todo.id){
      <li>
        <input
          type="checkbox"
          [checked]="todo.done"
          [disabled]="pendingTodoIds.has(todo.id)"
          (change)="toggle(todo)"
        />
        <span [class.done]="todo.done">{{todo.title}}</span>
        <button
          (click)="remove(todo)"
          [disabled]="pendingTodoIds.has(todo.id)"
        >{{pendingTodoIds.has(todo.id) ? 'Deleting...' : 'Delete'}}</button>
      </li>
    } @empty{
      <li>Nothing to do yet.</li>
    }
  </ul>
</main>


<router-outlet />
